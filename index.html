<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Clicker</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .balance-label {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .balance-count {
            font-size: 64px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 30px;
        }

        .coin {
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.05s;
            -webkit-user-drag: none;
        }

        .coin:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="balance-label">Твой баланс:</div>
    <div class="balance-count" id="balance">24</div>

    <img src="https://image.spreadshirtmedia.net/image-server/v1/compositions/T210A2PA4301PT17X51Y48D174116035W2498H2498/views/1,width=650,height=650,appearanceId=2,backgroundColor=000000/dollar-sign-icon-mens-t-shirt.jpg" 
         id="coinBtn" 
         class="coin" 
         alt="Dollar Logo" 
         draggable="false">

    <script>
        let score = 24;
        const balanceElement = document.getElementById('balance');
        const coinBtn = document.getElementById('coinBtn');

        function addScore() {
            score++;
            balanceElement.innerText = score;
        }

        coinBtn.onclick = addScore;
    </script>

</body>
</html>

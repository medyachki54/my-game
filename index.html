<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-user-select: none; /* Чтобы нельзя было выделить текст при кликах */
        }

        .balance-label {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .balance-count {
            font-size: 64px;
            font-weight: bold;
            color: #FFD700; /* Золотистый цвет для цифр */
            margin-bottom: 30px;
        }

        .coin {
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.1s active;
        }

        .coin:active {
            transform: scale(0.95); /* Эффект нажатия */
        }
    </style>
</head>
<body>

    <div class="balance-label">Твой баланс:</div>
    <div class="balance-count" id="balance">24</div>

    <img src="путь_к_картинке.png" class="coin" draggable="false">

    <script>
        let score = 24;
        const balanceElement = document.getElementById('balance');

        function addScore() {
            score++;
            balanceElement.innerText = score;
        }
    </script>

</body>
</html>

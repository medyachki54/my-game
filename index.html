<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IT Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .coin { width: 200px; cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .coin:active { transform: scale(0.9); }
        h1 { font-size: 48px; color: #f1c40f; margin: 10px 0; }
    </style>
</head>
<body>


    <div style="font-size: 20px;">Твой баланс:</div>
    <h1 id="balance">0</h1>
    <img id="clickBtn" src="https://img.icons8.com/emoji/256/gold-coin-emoji.png" class="coin">

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        const btn = document.getElementById('clickBtn');
        const bal = document.getElementById('balance');

        btn.onclick = () => {
            score++;
            bal.innerText = score;
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        };
    </script>
</body>
</html>
